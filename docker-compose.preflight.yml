# Isolated local readiness database. No existing volumes or databases are mounted.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kltn_demo
      POSTGRES_PASSWORD: local-preflight-only
      POSTGRES_DB: kltn_demo
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kltn_demo -d kltn_demo"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - day1_preflight:/var/lib/postgresql/data
volumes:
  day1_preflight:
